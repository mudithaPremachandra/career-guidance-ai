name: Tests

# Runs on every pull request into main (and on main itself), so a PR that breaks the engines or the UI
# cannot be merged once "tests" is a required status check in the branch ruleset.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pyflakes==3.4.0

      - name: Lint (undefined names, unused imports)
        run: python -m pyflakes app.py src tests

      - name: Engine tests (11 modules)
        run: python tests/test_pipeline.py

      - name: UI smoke test (runs app.py headlessly)
        run: python tests/test_app_smoke.py
